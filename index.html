<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPTEC</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <main id="loginScreen" class="pantalla-login">
    <section class="tarjeta-login">
      <div class="marca-logo">
        <img src="./img/LogoSIPTEC.png" alt="logo">
      </div>
      <h1>BIENVENIDO A SIPTEC</h1>
      <p>Sistema de préstamos e inventario de área técnica</p>
      <p class="hint">Ingresa tus credenciales para acceder al sistema</p>
      <form id="loginForm">
        <label for="email">Correo electrónico:</label>
        <input id="email" class="form-control" type="email" autocomplete="email" required>
        <label for="password">Contraseña:</label>
        <input id="password" class="form-control" type="password" autocomplete="current-password" required>
        <a href="pages/dashboard.html" id="loginBtn" class="btn boton-iniciar-sesion w-100 d-flex align-items-center justify-content-center text-decoration-none">Iniciar Sesión</a>
        <div id="loginError" class="text-danger small mt-2 d-none"></div>
        <p class="mt-4 mb-0 text-center" style="font-size: 11px; color: #8a9ba8;">Desarrollado por el departamento de Desarrollo de Software del Instituto Técnico Ricaldone</p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
