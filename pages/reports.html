<h2>Reportes</h2>

<div class="contenedor-pestanas">
  <input type="radio" name="reportTabs" id="tabHistorialReportes" checked>
  <input type="radio" name="reportTabs" id="tabGenerados">

  <div class="pestanas-segmentadas">
    <label for="tabHistorialReportes">Historial de reportes pasados</label>
    <label for="tabGenerados">Reportes generados</label>
  </div>

  <style>
    
  </style>

  <div class="panel-historial-reportes">
    <div class="tarjeta-tabla">
      <table>
        <thead>
          <tr>
            <th>Reporte</th>
            <th>Generado por</th>
            <th>Fecha</th>
            <th>Tipo</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Inventario mensual — julio</td>
            <td>Admin Principal</td>
            <td>31/07/2026</td>
            <td><span class="estado activo">Inventario</span></td>
          </tr>
          <tr>
            <td>Préstamos vencidos</td>
            <td>Admin Principal</td>
            <td>15/06/2026</td>
            <td><span class="estado pendiente">Préstamos</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel-generados">
    <div class="tarjeta-devolucion">
      <div class="top-row">
        <h4 style="margin:0;">Daño reportado: Soldadora</h4>
        <span class="estado daniado">Daño</span>
      </div>
      <p class="atenuado" style="margin-bottom:14px;">Generado por Admin Principal. La maquinaría tiene fallos eléctricos.</p>
      <p class="atenuado" style="margin-bottom:16px;">Fecha: 17/07/26, 4:36 p. m.</p>
      <div class="card-actions">
        <button type="button" class="boton-pastilla boton-contorno" data-bs-toggle="modal" data-bs-target="#reportViewerModal"><i class="bi bi-eye"></i> Ver</button>
        <div class="dropdown">
          <button class="boton-pastilla boton-solido-azul dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-download"></i> Exportar
          </button>
          <ul class="dropdown-menu">
            <li><button class="dropdown-item" type="button" data-export="txt">TXT</button></li>
            <li><button class="dropdown-item" type="button" data-export="pdf">PDF</button></li>
            <li><button class="dropdown-item" type="button" data-export="csv">CSV</button></li>
            <li><button class="dropdown-item" type="button" data-export="excel">Excel</button></li>
          </ul>
        </div>
        <button type="button" class="boton-pastilla boton-solido-rojo" title="Eliminar reporte"><img src="../img/icons8-trash-24.png" alt="Eliminar" class="icono-fila" style="filter:invert(1); opacity:1;"></button>
      </div>
    </div>
  </div>
</div>
