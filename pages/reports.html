<h2>Reportes</h2>

<div class="contenedor-pestanas">
  <input type="radio" name="reportTabs" id="tabHistorialReportes" checked>
  <input type="radio" name="reportTabs" id="tabGenerados">

  <div class="pestanas-segmentadas">
    <label for="tabHistorialReportes">Historial de reportes pasados</label>
    <label for="tabGenerados">Reportes generados</label>
  </div>

  <style>
    
  </style>

  <div class="panel-historial-reportes">
    <div class="tarjeta-tabla">
      <table>
        <thead>
          <tr>
            <th>Reporte</th>
            <th>Generado por</th>
            <th>Fecha</th>
            <th>Tipo</th>
          </tr>
        </thead>
        <tbody id="reportesHistorialBody">
          <tr><td colspan="4" class="text-center atenuado">Cargando historial...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel-generados">
    <div class="barra-seleccion-reportes">
      <button type="button" class="btn btn-outline-primary btn-sm" id="btnModoSeleccionReportes">
        <i class="bi bi-check2-square"></i> Seleccionar
      </button>
      <div class="d-none align-items-center gap-2" id="accionesSeleccionReportes">
        <span class="atenuado" id="contadorSeleccionReportes">0 seleccionados</span>
        <div class="dropdown">
          <button class="btn btn-success btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-download"></i> Exportar seleccionados
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" type="button" data-export-seleccion="txt">TXT</button></li>
            <li><button class="dropdown-item" type="button" data-export-seleccion="pdf">PDF</button></li>
            <li><button class="dropdown-item" type="button" data-export-seleccion="csv">CSV</button></li>
          </ul>
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCancelarSeleccionReportes">Cancelar</button>
      </div>
    </div>

    <div id="reportesGeneradosGrid">
      <p class="atenuado">Cargando equipos dañados...</p>
    </div>
  </div>
</div>
