<div class="encabezado-pagina">
  <h1>Préstamos</h1>
</div>

<div class="contenedor-pestanas">
  <input type="radio" name="loanTabs" id="tabPrestamos" checked>
  <input type="radio" name="loanTabs" id="tabDevoluciones">
  <input type="radio" name="loanTabs" id="tabHistorial">

  <div class="pestanas-segmentadas">
    <label for="tabPrestamos">Préstamos</label>
    <label for="tabDevoluciones" data-roles="ADMINISTRADOR">Devoluciones</label>
    <label for="tabHistorial">Historial</label>
  </div>

  <div class="panel-pestana panel-prestamos">
    <div class="diseno-prestamo">
      <div class="tarjeta-tabla">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre de usuario</th>
              <th>Fecha inicio</th>
              <th>Tipo</th>
              <th>Producto / Área</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="loansTableBody">
            <tr><td colspan="7" class="text-center atenuado">Cargando préstamos...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="panel-acciones" id="loanDetailPanel">
        <p class="atenuado">Selecciona un préstamo de la lista para ver el detalle.</p>
      </div>
    </div>
  </div>

  <div class="panel-pestana panel-devoluciones">
    <div class="cuadricula-devoluciones" id="devolucionesGrid">
      <p class="atenuado">Cargando devoluciones pendientes...</p>
    </div>
  </div>

  <div class="panel-pestana panel-historial">
    <div class="tarjeta-tabla">
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Herramienta / Área</th>
            <th>Inicio</th>
            <th>Entrega</th>
            <th>Usuario</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="historialTableBody">
          <tr><td colspan="6" class="text-center atenuado">Cargando historial...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
