<div class="encabezado-pagina">
  <h1>Usuarios</h1>
  <div class="acciones-encabezado">
    <div class="buscador-seccion">
      <i class="bi bi-search"></i>
      <input type="search" id="usersSearch" placeholder="Buscar por nombre o correo...">
    </div>
    <button type="button" class="boton-pastilla boton-solido-verde" data-bs-toggle="modal" data-bs-target="#userModal">
      <i class="bi bi-person-plus"></i> Crear usuario
    </button>
  </div>
</div>

<div class="tarjeta-tabla">
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo electrónico</th>
        <th>Rol</th>
        <th>Sección</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="usersTableBody">
      <tr><td colspan="6" class="text-center atenuado">Cargando usuarios...</td></tr>
    </tbody>
  </table>
</div>
