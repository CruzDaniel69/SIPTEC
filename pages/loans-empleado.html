<div class="encabezado-pagina">
  <h1>Préstamos</h1>
</div>

<div class="contenedor-pestanas">
  <input type="radio" name="empleadoLoanTabs" id="tabNuevoPrestamo" checked>
  <input type="radio" name="empleadoLoanTabs" id="tabMisPrestamos">

  <div class="pestanas-segmentadas">
    <label for="tabNuevoPrestamo">Nuevo préstamo</label>
    <label for="tabMisPrestamos">Mis préstamos</label>
  </div>

  <div class="panel-pestana panel-nuevo-prestamo">
    <div class="panel">
      <input type="radio" name="tipoSolicitudEmpleado" id="empTipoHerramienta" checked>
      <input type="radio" name="tipoSolicitudEmpleado" id="empTipoArea">

      <div class="pestanas-segmentadas" style="margin-bottom: 18px;">
        <label for="empTipoHerramienta">Herramienta</label>
        <label for="empTipoArea">Área</label>
      </div>

      <div class="empleado-seccion-herramienta row g-3">
        <div class="col-12">
          <div class="campo-flotante">
            <input id="empEquipo" class="form-control" list="empEquipoOptions" maxlength="100" placeholder=" " autocomplete="off" required>
            <label for="empEquipo">Herramienta a solicitar</label>
          </div>
          <datalist id="empEquipoOptions"></datalist>
          <small id="empEquipoAviso" class="atenuado"></small>
        </div>
        <div class="col-12 grupo-piezas">
          <span class="titulo-campo">Piezas disponibles</span>
          <div id="empUnidades" class="d-flex flex-wrap gap-2"></div>
        </div>
      </div>

      <div class="empleado-seccion-area row g-3">
        <div class="col-12">
          <div class="campo-flotante">
            <input id="empArea" class="form-control" list="empAreaOptions" maxlength="100" placeholder=" " autocomplete="off" required>
            <label for="empArea">Área a solicitar</label>
          </div>
          <datalist id="empAreaOptions"></datalist>
          <small id="empAreaAviso" class="atenuado"></small>
        </div>
      </div>

      <div class="row g-3" style="margin-top: 2px;">
        <div class="col-md-6">
          <div class="campo-flotante">
            <input id="empFechaInicio" class="form-control" type="datetime-local" required>
            <label for="empFechaInicio">Inicio</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="campo-flotante">
            <input id="empFechaEsperada" class="form-control" type="datetime-local" required>
            <label for="empFechaEsperada">Devolución esperada</label>
          </div>
        </div>
        <div class="col-12">
          <div class="campo-flotante">
            <textarea id="empObservaciones" class="form-control" rows="3" maxlength="150" placeholder=" "></textarea>
            <label for="empObservaciones">Observaciones (opcional)</label>
          </div>
        </div>
      </div>

      <button type="button" id="btnEnviarSolicitud" class="boton-pastilla boton-solido-verde" style="margin-top: 18px;">
        <i class="bi bi-send"></i> Enviar solicitud
      </button>
    </div>
  </div>

  <div class="panel-pestana panel-mis-prestamos">
    <div class="tarjeta-tabla">
      <table>  <!-- En esta Tabla iran las inserciones para el javascript, filtradas por el usuario en sesión -->
        <thead>
          <tr>
            <th>Código</th>
            <th>Fecha inicio</th>
            <th>Tipo</th>
            <th>Producto / Área</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="misPrestamosTableBody">
          <tr class="fila-esqueleto" aria-label="Cargando"><td colspan="5"><div class="esqueleto-bloque"><span class="esqueleto"></span><span class="esqueleto"></span><span class="esqueleto"></span><span class="esqueleto corto"></span></div></td></tr>
        </tbody>
      </table>
    </div>
    <div id="misPrestamosPaginador" class="paginador"></div>
  </div>
</div>
