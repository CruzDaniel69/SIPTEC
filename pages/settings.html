<h2>Configuracion</h2>

<div class="settings-box">
  <div>
    <label class="form-label" for="settingsFirstName">Nombre de Usuario</label>
    <input id="settingsFirstName" class="form-control" value="Admin">

    <label class="form-label" for="settingsLastName">Apellido del Usuario</label>
    <input id="settingsLastName" class="form-control" value="Principal">

    <button type="button" class="btn-pill btn-outline" style="background:#02162b; color:#fff; border:0;">Guardar Cambios</button>
  </div>

  <div class="settings-divider"></div>

  <div>
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
      <label class="ios-switch">
        <input type="checkbox" id="darkModeToggle">
        <span class="slider"></span>
      </label>
      <span>Apariencia (modo oscuro)</span>
    </div>

    <button type="button" class="btn-pill btn-outline" id="logoutBtnSettings">
      Cerrar Sesión <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</div>
