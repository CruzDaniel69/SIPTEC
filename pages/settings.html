<h2>Configuración</h2>

<div class="caja-configuracion">
  <div>
    <div class="campo-flotante" style="margin-bottom:14px;">
      <input id="settingsFirstName" class="form-control" placeholder=" " autocomplete="off">
      <label for="settingsFirstName">Nombre</label>
    </div>

    <div class="campo-flotante" style="margin-bottom:18px;">
      <input id="settingsLastName" class="form-control" placeholder=" " autocomplete="off">
      <label for="settingsLastName">Apellido</label>
    </div>

    <button type="button" id="btnGuardarPerfil" class="boton-pastilla boton-contorno" style="background:#02162b; color:#fff; border:0;">Guardar Cambios</button>
  </div>

  <div class="divisor-configuracion"></div>

  <div>
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
      <label class="interruptor">
        <input type="checkbox" id="darkModeToggle">
        <span class="slider"></span>
      </label>
      <span>Apariencia (modo oscuro)</span>
    </div>

    <button type="button" class="boton-pastilla boton-contorno" id="logoutBtnSettings">
      Cerrar Sesión <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</div>
